# Shenxian Dashboard reverse proxy include for Nginx/1Panel.
# Include this file inside the HTTPS server block for de.sxnn.de.

location ^~ /proto.ShenxianService/ {
    grpc_pass grpc://127.0.0.1:18181;

    grpc_set_header Host $http_host;
    grpc_set_header X-Forwarded-Host $http_host;
    grpc_set_header X-Forwarded-Port $server_port;
    grpc_set_header X-Real-IP $remote_addr;
    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    grpc_set_header X-Forwarded-Proto $scheme;
    grpc_set_header nz-realip $remote_addr;
    grpc_set_header sx-realip $remote_addr;

    grpc_read_timeout 600s;
    grpc_send_timeout 600s;
    grpc_socket_keepalive on;
    grpc_buffer_size 4m;
    client_max_body_size 10m;
}

location ^~ /proto.NezhaService/ {
    grpc_pass grpc://127.0.0.1:18181;

    grpc_set_header Host $http_host;
    grpc_set_header X-Forwarded-Host $http_host;
    grpc_set_header X-Forwarded-Port $server_port;
    grpc_set_header X-Real-IP $remote_addr;
    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    grpc_set_header X-Forwarded-Proto $scheme;
    grpc_set_header nz-realip $remote_addr;
    grpc_set_header sx-realip $remote_addr;

    grpc_read_timeout 600s;
    grpc_send_timeout 600s;
    grpc_socket_keepalive on;
    grpc_buffer_size 4m;
    client_max_body_size 10m;
}

location ~* ^/api/v1/ws/(server|terminal|file)(.*)$ {
    proxy_pass http://127.0.0.1:18181;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header Origin https://$http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header nz-realip $remote_addr;
    proxy_set_header sx-realip $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ / {
    proxy_pass http://127.0.0.1:18181;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header nz-realip $remote_addr;
    proxy_set_header sx-realip $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffer_size 128k;
    proxy_buffers 4 128k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;
}
