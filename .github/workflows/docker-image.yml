name: Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/abxian/shenxian

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docker publisher
        uses: actions/checkout@v4

      - name: Checkout private dashboard source
        uses: actions/checkout@v4
        with:
          repository: abxian/nz
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: src

      - name: Checkout private admin frontend source
        uses: actions/checkout@v4
        with:
          repository: abxian/admin-frontend
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: admin-frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Build admin frontend
        working-directory: admin-frontend
        run: |
          npm ci
          npm run build
          rm -rf ../src/cmd/dashboard/admin-dist
          mkdir -p ../src/cmd/dashboard/admin-dist
          cp -R dist/* ../src/cmd/dashboard/admin-dist/
          mkdir -p ../src/cmd/dashboard/user-dist
          if [ ! -f ../src/cmd/dashboard/user-dist/index.html ]; then
            printf '<!doctype html><html><head><meta charset="utf-8"><title>Shenxian Monitoring</title></head><body>Shenxian Monitoring</body></html>\n' > ../src/cmd/dashboard/user-dist/index.html
          fi

      - name: Generate dashboard swagger docs
        working-directory: src
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          "$(go env GOPATH)/bin/swag" init --pd -d cmd/dashboard -g main.go -o cmd/dashboard/docs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Shenxian Monitoring Dashboard
            org.opencontainers.image.source=https://github.com/abxian/shenxian-docker
            org.opencontainers.image.description=Shenxian Monitoring Dashboard
